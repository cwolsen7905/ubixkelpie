# Autofix sweep (dev): every 15 minutes, `kelpie:sweep` over the open MRs of the enrolled projects (rows of `projects` that are not off)
# and the failed-pipeline source. The backstop for webhook deliveries that were lost: it only queues jobs
# in the autofix_jobs table, and the kelpie-worker Deployment (`kelpie:work`) runs them. Same image, namespace, Vault role and KV path as the
# kelpie-api Deployment; nothing here is new infrastructure.
#
# SUSPENDED on purpose. Un-suspend (suspend: false) only once all of this is true:
#   - the `ubixkelpie` database has the autofix_jobs migration (the migrate-apply-dev job applies
#     it; the job table is needed when KELPIE_AUTOFIX_ENABLED=true);
#   - uBixVault `kelpie/dev/app` holds KELPIE_BOT_GITLAB_TOKEN, OPENROUTER_API_KEY and
#     GITLAB_API_URL (the fail-closed read makes the pod fail otherwise);
#   - the image has the `claude` CLI the fixer runs (the sweep reports only, without it, while
#     KELPIE_AUTOFIX_ENABLED is not "true");
#   - the entrypoint's Vault hydration is confirmed to run for this command override.
# uBixCore's ci/bin/deploy.sh applies this file on every dev deploy; with suspend: true the
# CronJob exists but never runs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kelpie-autofix-sweep
  namespace: kelpie-dev
  labels:
    app.kubernetes.io/name: kelpie-autofix-sweep
    app.kubernetes.io/part-of: kelpie
spec:
  schedule: "*/15 * * * *"
  suspend: true
  # A slow sweep must not overlap the next one: two sweeps would race on the same threads.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 840
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kelpie-autofix-sweep
            app.kubernetes.io/part-of: kelpie
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.brainchurts.com/tier
                        operator: NotIn
                        values: [light]
          containers:
          - name: sweep
            image: gitlab.brainchurts.com:5050/ubixsys/ubixkelpie:dev
            imagePullPolicy: Always
            command: ["php", "/web/bin/ubix", "kelpie:sweep"]
            env:
            - name: APP_NAME
              value: "KelpieApi"
            - name: ENV
              value: "DEV"
            - name: VAULT_ADDR
              value: "https://vault.dev.ubixsys.com"
            - name: VAULT_K8S_ROLE
              value: "kelpie-dev"
            # Database ubixkelpie. Credentials from uBixVault kelpie/dev/db; the host must equal
            # secret/kelpie/db-dev.host, which the migrate job checks before it migrates.
            - name: VAULT_DB_STRATEGY
              value: "kv"
            - name: VAULT_DB_KV_PATH
              value: "kelpie/dev/db"
            - name: MYSQL_WRITE_HOST
              value: "10.50.25.62"
            - name: MYSQL_WRITE_PORT
              value: "3306"
            - name: MYSQL_WRITE_DATABASE
              value: "ubixkelpie"
            - name: MYSQL_READ_HOST
              value: "10.50.25.62"
            - name: MYSQL_READ_PORT
              value: "3306"
            - name: MYSQL_READ_DATABASE
              value: "ubixkelpie"
            - name: VAULT_APP_KV_PATH
              value: "kelpie/dev/app"
            - name: IS_DEV
              value: "true"
            - name: IS_SANDBOX
              value: "false"
            - name: IS_STAGING
              value: "false"
            # On, in propose mode: what Kelpie may do on a project is its row in `projects` (no row, off); this flag is the kill switch.
            - name: KELPIE_AUTOFIX_ENABLED
              value: "true"
            # The bot account whose notes mark a thread as Kelpie's own (the code default is not the real account).
            - name: KELPIE_BOT_USERNAME
              value: "group_223_bot_b747917a6c6e1334faf2e8ca743faae9"
            - name: LOG_LEVEL
              value: "debug"
            # uBixCore's CLI logger writes $LOGGER_PATH/<app>.log; unset it resolves to /UbixCli.log, which the container user cannot create.
            # (php/Ubix/Bootstrap/cli-dependencies.php, uBixCore v0.47.0.) The dir is an emptyDir on purpose: it survives container
            # restarts and is dropped with the pod; a sweep pod is short-lived anyway. No persistent volume.
            - name: LOGGER_PATH
              value: "/tmp/logs"
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {cpu: 500m, memory: 256Mi}
            securityContext:
              allowPrivilegeEscalation: false
              privileged: false
            volumeMounts:
            - name: logs
              mountPath: /tmp/logs
          volumes:
          - name: logs
            emptyDir: {sizeLimit: 1Gi}
          imagePullSecrets:
          - name: regcred
          restartPolicy: Never
