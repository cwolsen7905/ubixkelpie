# Gate pod (dev): `kelpie:gate-serve` runs the fix gate's steps (phpcs, phpstan, phpunit, `make check`) that the
# worker sends it, so the repository's code, including what the fixer wrote, never runs next to the worker's secrets.
# It serves runs one at a time. After every run it kills every other process in the container (it is PID 1), empties
# /work and /tmp, and only then is ready again; if that reset fails it exits 1 and Kubernetes replaces the container.
# After KELPIE_GATE_MAX_RUNS runs it exits 0. It also empties /work and /tmp at start (an emptyDir outlives a
# container restart). See docs/security/gate-pod.md.
#
# The pod holds nothing: its own ServiceAccount with no token mounted and no RBAC, no envFrom, no Vault, no secrets.
# Same image as the worker. The NetworkPolicy lets in only the worker, on the gate port, and lets nothing out.
#
# Not applied by uBixCore ci/bin/deploy.sh: it applies <env>-deploy.yaml, -service.yaml, -ingress.yaml and
# -cronjob*.yaml (newer uBixCore also -worker*.yaml); <env>-gate.yaml matches none of them. Apply by hand, dev
# first: kubectl apply -f app/KelpieApi/dev-gate.yaml. The worker uses it only once its KELPIE_GATE_URL is set to
# http://kelpie-gate:8090 (until then it gates locally, as before).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kelpie-gate
  namespace: kelpie-dev
  labels:
    app.kubernetes.io/name: kelpie-gate
    app.kubernetes.io/part-of: kelpie
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kelpie-gate
  namespace: kelpie-dev
  labels:
    app.kubernetes.io/name: kelpie-gate
    app.kubernetes.io/part-of: kelpie
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: kelpie-gate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kelpie-gate
        app.kubernetes.io/part-of: kelpie
    spec:
      serviceAccountName: kelpie-gate
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Express constraints negatively (kitg docs/standards/scheduling.md): keep off the light tier (SD-card nodes).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.brainchurts.com/tier
                    operator: NotIn
                    values: [light]
      # uid/gid 1000 is the image's `www` user (ubixcore-php base image).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kelpie-gate
        # `php` itself must be PID 1, with no shell in front: the reset between runs kills every other process from PID 1
        # (and refuses, so the server exits, when it is not). `command` replaces the image's entrypoint.
        command: ["php", "/web/bin/ubix", "kelpie:gate-serve"]
        image: gitlab.brainchurts.com:5050/ubixsys/ubixkelpie:dev
        imagePullPolicy: Always
        # Settings only, no secrets. The steps themselves get HOME and PATH and nothing else.
        env:
        - name: KELPIE_GATE_PORT
          value: "8090"
        - name: KELPIE_GATE_WORK_DIR
          value: "/work"
        - name: KELPIE_GATE_READY_FILE
          value: "/tmp/gate-ready"
        - name: KELPIE_GATE_CLEAN_DIRS
          value: "/tmp"
        # 512 MiB: the largest checkout archive (gzip, vendor/ included) the pod accepts.
        - name: KELPIE_GATE_MAX_BODY_BYTES
          value: "536870912"
        # Runs per container before a clean exit and a fresh one; the reset between runs is the main guarantee.
        - name: KELPIE_GATE_MAX_RUNS
          value: "100"
        - name: LOGGER_PATH
          value: "/logs"
        - name: IS_DEV
          value: "true"
        ports:
        - name: gate
          containerPort: 8090
          protocol: TCP
        # Ready while it waits for a run; the server removes the file when a run starts and writes it again only after
        # the reset, so the Service sends nothing to a pod that is busy or resetting.
        readinessProbe:
          exec:
            command: ["sh", "-c", "test -f /tmp/gate-ready"]
          periodSeconds: 2
          failureThreshold: 1
          successThreshold: 1
        # As the worker had for the gate: phpstan and phpunit need the memory.
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits: {cpu: 1000m, memory: 2Gi}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        # The only writable places. Each is size-limited; going over gets the pod evicted, which is a clean pod.
        volumeMounts:
        - name: work
          mountPath: /work
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /logs
        - name: web-var
          mountPath: /web/var
        - name: web-log
          mountPath: /web/log
      volumes:
      - name: work
        emptyDir: {sizeLimit: 4Gi}
      - name: tmp
        emptyDir: {sizeLimit: 1Gi}
      - name: logs
        emptyDir: {sizeLimit: 256Mi}
      - name: web-var
        emptyDir: {sizeLimit: 64Mi}
      - name: web-log
        emptyDir: {sizeLimit: 64Mi}
      imagePullSecrets:
      - name: regcred
      restartPolicy: Always
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kelpie-gate
  namespace: kelpie-dev
  labels:
    app.kubernetes.io/name: kelpie-gate
    app.kubernetes.io/part-of: kelpie
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kelpie-gate
  ports:
  - name: gate
    port: 8090
    targetPort: gate
    protocol: TCP
---
# In: only the worker's pods, only the gate port. Out: nothing (no DNS, no GitLab, no database, no Kubernetes API).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kelpie-gate
  namespace: kelpie-dev
  labels:
    app.kubernetes.io/name: kelpie-gate
    app.kubernetes.io/part-of: kelpie
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kelpie-gate
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kelpie-worker
    ports:
    - protocol: TCP
      port: 8090
  egress: []
