# Autofix sweep (dev): every 15 minutes, `kelpie:sweep` over the open MRs of KELPIE_AUTOFIX_PROJECTS
# (docs/design/mr-thread-autofix.md, step 8). Same image, namespace, Vault role and KV path as the
# kelpie-api Deployment; nothing here is new infrastructure.
#
# SUSPENDED on purpose. Un-suspend (suspend: false) only once all of this is true:
#   - the `kelpie` database exists and the autofix_jobs migration is applied (the job table is
#     needed when KELPIE_AUTOFIX_ENABLED=true; VAULT_DB_STRATEGY below is still "none");
#   - uBixVault `kelpie/dev/app` holds KELPIE_BOT_GITLAB_TOKEN, OPENROUTER_API_KEY and
#     GITLAB_API_URL (the fail-closed read makes the pod fail otherwise);
#   - the image has the `claude` CLI the fixer runs (the sweep reports only, without it, while
#     KELPIE_AUTOFIX_ENABLED is not "true");
#   - the entrypoint's Vault hydration is confirmed to run for this command override.
# bin/deploy.sh applies only <env>-{deploy,service,ingress}.yaml, so this file is not rolled out
# until the script is taught to apply it (bin/ is outside the autofix lane).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kelpie-autofix-sweep
  namespace: kelpie-dev
  labels:
    app.kubernetes.io/name: kelpie-autofix-sweep
    app.kubernetes.io/part-of: kelpie
spec:
  schedule: "*/15 * * * *"
  suspend: true
  # A slow sweep must not overlap the next one: two sweeps would race on the same threads.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 840
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kelpie-autofix-sweep
            app.kubernetes.io/part-of: kelpie
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.brainchurts.com/tier
                        operator: NotIn
                        values: [light]
          containers:
          - name: sweep
            image: gitlab.brainchurts.com:5050/ubixsys/ubixkelpie:dev
            imagePullPolicy: Always
            command: ["php", "/web/bin/ubix", "kelpie:sweep"]
            env:
            - name: APP_NAME
              value: "KelpieApi"
            - name: ENV
              value: "DEV"
            - name: VAULT_ADDR
              value: "https://vault.dev.ubixsys.com"
            - name: VAULT_K8S_ROLE
              value: "kelpie-dev"
            - name: VAULT_DB_STRATEGY
              value: "none"
            - name: VAULT_APP_KV_PATH
              value: "kelpie/dev/app"
            - name: IS_DEV
              value: "true"
            - name: IS_SANDBOX
              value: "false"
            - name: IS_STAGING
              value: "false"
            - name: LOG_LEVEL
              value: "debug"
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {cpu: 500m, memory: 256Mi}
            securityContext:
              allowPrivilegeEscalation: false
              privileged: false
          imagePullSecrets:
          - name: regcred
          restartPolicy: Never
