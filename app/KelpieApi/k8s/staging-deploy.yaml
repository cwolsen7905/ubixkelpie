# KelpieApi (staging). Secrets come from uBixVault at pod start (VAULT_APP_KV_PATH),
# never from this file. Applied by bin/deploy.sh; {{DATE_STAMP}} forces a roll when
# the mutable image tag has not changed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kelpie-api
  namespace: kelpie-staging
  labels:
    app.kubernetes.io/name: kelpie-api
    app.kubernetes.io/part-of: kelpie
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: kelpie-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        date: "{{DATE_STAMP}}"
      labels:
        app.kubernetes.io/name: kelpie-api
        app.kubernetes.io/part-of: kelpie
    spec:
      # Express constraints negatively (kitg docs/standards/scheduling.md): keep
      # off the light tier (SD-card nodes).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.brainchurts.com/tier
                    operator: NotIn
                    values: [light]
      containers:
      - name: kelpie-api
        image: gitlab.brainchurts.com:5050/ubixsys/ubixkelpie:staging
        imagePullPolicy: Always
        env:
        - name: APP_NAME
          value: "KelpieApi"
        - name: ENV
          value: "STAGING"
        - name: VAULT_ADDR
          value: "https://vault.prod.ubixsys.com"
        # Bound to namespace kelpie-staging; created by ubixvault configure.sh (kubernetes repo).
        - name: VAULT_K8S_ROLE
          value: "kelpie-staging"
        # Kelpie has no database: skip the DB secret read, still hydrate VAULT_APP_KV_PATH.
        - name: VAULT_DB_STRATEGY
          value: "none"
        # GITLAB_WEBHOOK_SECRET, GITLAB_API_URL, GITLAB_PROJECT_TOKENS, APPROVAL_JOB_NAMES.
        # uBixVault fails closed on a missing path or key, so the pod never goes
        # ready without them and the deploy's rollout wait fails.
        - name: VAULT_APP_KV_PATH
          value: "kelpie/staging/app"
        - name: IS_DEV
          value: "false"
        - name: IS_SANDBOX
          value: "false"
        - name: IS_STAGING
          value: "true"
        - name: LOG_LEVEL
          value: "info"
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        # Readiness only, no liveness probe: a wrong liveness probe restarts healthy
        # pods forever. /health touches nothing, so it adds no load in an incident.
        readinessProbe:
          httpGet: {path: /health, port: 8080}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
      imagePullSecrets:
      - name: regcred
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
